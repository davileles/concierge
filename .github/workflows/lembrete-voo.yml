name: Lembrete de Voo — 48h antes

on:
  schedule:
    - cron: '0 * * * *'   # toda hora (UTC) — cobre horários BR de 21h a 20h
  workflow_dispatch: {}    # execução manual pela aba Actions ou dispatcher do proxy

concurrency:
  group: lembrete-voo
  cancel-in-progress: false

jobs:
  lembrete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checar acesso do token ao repo de dados (diagnostico)
        continue-on-error: true
        env:
          CDV_GITHUB_TOKEN: ${{ secrets.CDV_CONCIERGE_TOKEN }}
        run: |
          st=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CDV_GITHUB_TOKEN" https://api.github.com/repos/davileles/dados/contents/concierge)
          echo "ACESSO_DADOS_LEITURA=$st"
          perm=$(curl -s -H "Authorization: Bearer $CDV_GITHUB_TOKEN" https://api.github.com/repos/davileles/dados | python3 -c "import json,sys;print(json.load(sys.stdin).get('permissions'))" 2>/dev/null)
          echo "PERMISSOES_DADOS=$perm"

      - name: Verificar e enviar lembretes de voo (com retry)
        env:
          CDV_GITHUB_TOKEN: ${{ secrets.CDV_CONCIERGE_TOKEN }}
          CDV_SERVICO_CONCIERGE: ${{ secrets.CDV_SERVICO_CONCIERGE }}
        run: |
          for i in 1 2 3; do
            node lembrete-voo.js && exit 0
            echo "Tentativa $i falhou; aguardando 60s..."
            sleep 60
          done
          echo "Todas as tentativas falharam."
          exit 1
